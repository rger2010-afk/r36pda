name: build r36pda

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu wget tar file

      - name: Cross-compile SDL2 (static)
        run: |
          cd "$HOME"
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.0.22/SDL2-2.0.22.tar.gz
          tar xzf SDL2-2.0.22.tar.gz
          cd SDL2-2.0.22
          mkdir -p build && cd build
          ../configure \
            --host=aarch64-linux-gnu \
            --disable-shared --enable-static \
            --prefix="$HOME/sdl2-arm64" \
            --disable-video-x11 --disable-video-wayland \
            --disable-video-offscreen --disable-video-vulkan \
            --disable-alsa --disable-pulseaudio --disable-oss --disable-joystick-virtual \
            --enable-video-fbcon --enable-video-kmsdrm \
            --disable-sdltest
          make -j$(nproc)
          make install

      - name: Build r36pda (statically linked)
        run: |
          make clean
          make \
            CXX=aarch64-linux-gnu-g++ \
            CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -static" \
            SDL_CFLAGS="-I$HOME/sdl2-arm64/include/SDL2" \
            SDL_LIBS="$HOME/sdl2-arm64/lib/libSDL2.a -lstdc++ -lm -lpthread -ldl"

      - name: Package
        run: make package

      - name: Verify
        run: |
          file r36pda-port/r36pda/r36pda
          echo '--- ldd ---'
          ldd r36pda-port/r36pda/r36pda || echo "(fully static - no dynamic deps)"
          ls -la r36pda-port/r36pda/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r36pda-port
          path: r36pda-port
          if-no-files-found: error