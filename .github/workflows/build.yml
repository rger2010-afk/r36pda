name: build r36pda

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in arm64 container
        run: |
          docker run --platform linux/arm64 --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            ubuntu:24.04 bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends g++ make libsdl2-dev file
              make
              make package
              file r36pda-port/r36pda/r36pda
              echo '--- ldd ---'
              ldd r36pda-port/r36pda/r36pda || true
              echo '--- size ---'
              ls -la r36pda-port/r36pda/r36pda
            '

      - name: Verify artifact
        run: |
          ls -la r36pda-port/r36pda/
          file r36pda-port/r36pda/r36pda

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r36pda-port
          path: r36pda-port
          if-no-files-found: error